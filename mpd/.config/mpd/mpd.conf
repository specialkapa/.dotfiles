# MPD for the Spotify Downloader plugin's music library.
# Docs: https://mpd.readthedocs.io/en/stable/user.html

music_directory     "~/Music/Spotify"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# Local connections only (rmpc, mpc and the Omarchy plugin).
bind_to_address     "127.0.0.1"
port                "6600"

# Pick up new downloads automatically.
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}

# Feed for the rmpc audio visualizer (cava). Doesn't affect what you hear.
audio_output {
    type    "fifo"
    name    "Visualizer feed"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
