prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 0.45
    height: 0.6
    position: auto
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  issues:
    - command: gh issue create
      key: C
      name: create new issue
  prs:
    - command: gh pr create --editor
      key: C
      name: create new PR
repoPaths: {}
theme:
  ui:
    sectionsShowCount: true
  table:
    showSeparators: true
    compact: false
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#a6adc8"
      inverted: "#1e1e2e"
      faint: "#7f849c"
      warning: "#f38ba8"
      success: "#a6e3a1"
      actor: "#cba6f7"
    background:
      selected: "#45475a"
    border:
      primary: "#b4befe"
      secondary: "#585b70"
      faint: "#313244"
    inline:
      icons:
        newcontributor: "077"
        contributor: "075"
        collaborator: "178"
        member: "178"
        owner: "178"
        unknownrole: "178"
  icons:
    inline:
      newcontributor: "󰎔"
      contributor: ""
      collaborator: ""
      member: ""
      owner: ""
      unknownrole: "󰭙"
pager:
  diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
