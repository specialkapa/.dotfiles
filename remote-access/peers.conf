# Remote access settings read by remote-access/setup.sh (sourced as bash).
# Nothing secret lives here: Tailscale 100.x / fd7a: addresses only work inside my tailnet.

# Devices allowed to reach the guarded ports over Tailscale (besides this machine itself).
# iPhone 13 mini. If it ever re-registers with Tailscale, update these from `tailscale status`.
ALLOWED_V4=(100.101.241.116)
ALLOWED_V6=(fd7a:115c:a1e0::e038:f175)

# TCP ports only reachable from loopback and the devices above.
GUARDED_PORTS=(22 3389)

# Remote Desktop (kokd.remote-desktop + hypr-rdp)
RDP_USER=rdp-iphone
RDP_PORT=3389
RDP_OUTPUT=DP-2   # monitor to share; falls back to the first monitor if absent
RDP_FPS=30
RDP_AUDIO=false
